name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  build_and_test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Dependencies Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install curl autoconf automake libtool pkg-config

      - name: Install Dependencies MacOS
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install curl autoconf automake libtool pkg-config

      - name: Build
        env:
          LIBPOSTAL_DATA_DIR: ${GITHUB_WORKSPACE}/data
        run: |
          ./bootstrap.sh
          ./configure --datadir="$LIBPOSTAL_DATA_DIR"
          make

      - name: Test
        run: make check
      - name: Notify Slack on failure
        if: (failure() || cancelled()) && github.ref_name == github.event.repository.default_branch
        uses: senzing-factory/build-resources/slack-failure-notification@v4
        with:
          job-status: ${{ job.status }}
          slack-channel: ${{ secrets.SLACK_CHANNEL }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
